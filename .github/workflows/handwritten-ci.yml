name: 手写相册 CI

# 每次推送到 main 自动编译一个 arm64 测试版 APK（开启 R8 优化的 release，离线版、不含内置模型），
# 编译完成后在 Actions 页面的 Artifacts 里下载安装。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: handwritten-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  debug_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
      - name: Fix permissions
        run: chmod +x ./gradlew scripts/native/*.sh
      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
      - name: Use the shared debug keystore
        # 固定的调试签名，这样每次的测试版可以直接覆盖安装，不用先卸载。
        # 这是公开的调试密钥（密码 android），只用于测试版，不用于正式发布。
        run: mkdir -p ~/.android && cp .github/debug.keystore ~/.android/debug.keystore
      - name: Build native codecs
        uses: ./.github/actions/build-native-libs
        with:
          arch: Arm64-v8a
      - name: Build optimized test APK
        run: ./gradlew --build-cache :app:androidApp:assembleArm64-v8aNoMLRelease
      - uses: actions/upload-artifact@v5
        with:
          name: HandwrittenAlbum-test-arm64
          path: |
            app/androidApp/build/outputs/apk-renamed/**/*.apk
            app/androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish rolling test release
        # 推送到 main 时，自动把安装包发布到固定地址的“最新测试版”，电脑关机也不影响
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          APK=$(find app/androidApp/build/outputs/apk-renamed -name "*.apk" | head -1)
          cp "$APK" HandwrittenAlbum-test-arm64.apk
          gh release delete test-latest -y --cleanup-tag || true
          gh release create test-latest HandwrittenAlbum-test-arm64.apk --prerelease --target "${{ github.sha }}"             --title "最新测试版 · $(date -u +%m-%d) · ${GITHUB_SHA::7}"             --notes "每次更新代码后自动生成。最近一次改动：$HEAD_MSG"
